name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc -p __tests__ --noEmit
      - run: npx eslint src __tests__ plugins index.js scripts/build-charsets.mjs
      - run: npx jest
      # Native dependencies must match the Expo SDK, or release builds can break.
      - run: npx expo install --check
      # Generates android/ the way release builds do, so a config plugin that no
      # longer matches the Expo template fails here rather than at release time.
      - run: npx expo prebuild --platform android --no-install
